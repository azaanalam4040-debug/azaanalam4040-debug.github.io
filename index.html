<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azaan Alam</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #111827, #1f2937);
            color: #111827;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px;
        }

        .card {
            width: 100%;
            max-width: 700px;

            background: white;
            border-radius: 20px;
            padding: 45px;

            text-align: center;

            box-shadow:
                0 20px 40px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        .intro {
            font-size: 1.15rem;
            color: #4b5563;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .logo {
            width: 180px;
            max-width: 100%;
            margin: 10px 0 30px;

            transition: transform 0.3s ease;
        }

        .logo:hover {
            transform: scale(1.08);
        }

        form {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        input[type="text"] {
            flex: 1;
            min-width: 220px;

            padding: 14px 16px;

            border: 2px solid #d1d5db;
            border-radius: 10px;

            font-size: 1rem;

            outline: none;
            transition: 0.2s;
        }

        input[type="text"]:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        input[type="submit"] {
            padding: 14px 24px;

            border: none;
            border-radius: 10px;

            background: #2563eb;
            color: white;

            font-size: 1rem;
            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        input[type="submit"]:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
        }

        .footer {
            margin-top: 30px;
            font-size: 0.85rem;
            color: #9ca3af;
        }

        @media (max-width: 600px) {
            .card {
                padding: 30px 20px;
            }

            h1 {
                font-size: 2.3rem;
            }

            form {
                flex-direction: column;
            }

            input[type="submit"] {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <main class="card">

        <h1>Portfolio</h1>

        <p class="intro">
            <strong>I'm Azaan Alam.</strong><br>
            I'm a student at the Bronx High School of Science
            exploring programming, technology, and web development.
        </p>

        <img
            class="logo"
            src="300px-Nerv_Logo.png"
            alt="NERV Logo"
        >

        <form>
            <input
                type="text"
                placeholder="Type something..."
            >

            <input
                type="submit"
                value="Submit"
            >
        </form>

        <p class="footer">
            Made by Azaan Alam
        </p>

    </main>

</body>
</html>
